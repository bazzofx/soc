server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # gzip static assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # hashed build assets (js/css/images) -> cache aggressively
    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # scenario data bundles: revalidate on redeploy
    location ~* /data/.*\.json$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # SPA fallback (hash routing keeps everything under index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # never serve hidden files
    location ~ /\. {
        deny all;
        return 404;
    }
}
