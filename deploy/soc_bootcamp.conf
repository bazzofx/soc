# =============================================================================
#  soc_bootcamp.conf — host nginx server block for the SOC Investigation Bootcamp
#
#  The app is built and exported by the Docker image (no web server in the
#  container). The static files land in /var/www/soc-bootcamp:
#
#      docker build -t soc-bootcamp .
#      docker run --rm -v /var/www/soc-bootcamp:/out soc-bootcamp
#
#  Install this file on the HOST nginx:
#      sudo cp deploy/soc_bootcamp.conf /etc/nginx/conf.d/soc_bootcamp.conf
#      sudo nano /etc/nginx/conf.d/soc_bootcamp.conf     # server_name / listen
#      sudo nginx -t && sudo systemctl reload nginx
#
#  Adjust: server_name, listen (80/443). For HTTPS add your certificate lines
#  (or use certbot) and keep the same root/location block.
# =============================================================================

server {
    listen 80;
    server_name soc-bootcamp.example.com;   # ← change to your hostname / IP

    # directory populated by the Docker export step
    root /var/www/soc-bootcamp;
    index index.html;

    server_tokens off;

    # ---- security headers ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- compression ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- hashed build assets (js/css/images) → cache hard ----
    location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- scenario data bundles + theme assets → revalidate on redeploy ----
    location ~* /(data|theme)/.*\.(json|gif|jpg|png)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    # ---- SPA entry point (hash routing keeps routes under index.html) ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # never serve hidden files
    location ~ /\. {
        deny all;
        return 404;
    }
}
